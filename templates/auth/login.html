{% extends "base.html" %}

{% block content %}
<style>
    body {
        background-color: var(--tekfix-bg) !important;
        background-image: radial-gradient(circle at 10% 20%, rgba(197, 160, 89, 0.04) 0%, transparent 40%),
                          radial-gradient(circle at 90% 80%, rgba(223, 186, 115, 0.04) 0%, transparent 40%) !important;
    }

    /* Ocultar barra superior en el login para un layout limpio y enfocado */
    .navbar-custom {
        display: none !important;
    }

    .login-card {
        background: #FFFFFF;
        border: 1px solid var(--tekfix-border);
        border-radius: 20px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.06);
        overflow: hidden;
        position: relative;
    }

    .login-card-header-accent {
        height: 6px;
        background: var(--tekfix-gradient);
        width: 100%;
    }

    .login-brand-logo {
        max-width: 460px;
        width: 100%;
        border-radius: 16px;
        box-shadow: 0 15px 40px rgba(0, 0, 0, 0.08);
        border: 1px solid var(--tekfix-border);
        transition: transform 0.3s ease;
    }

    .login-brand-logo:hover {
        transform: scale(1.01);
    }
</style>

<div class="row align-items-center justify-content-center g-5 py-5" style="min-height: 85vh;">
    <!-- Columna Izquierda: Tarjeta de Acceso con Relieve y Borde Superior en Degradado Oro -->
    <div class="col-12 col-md-6 col-lg-5">
        <div class="login-card">
            <!-- Borde superior decorativo en degradado oro -->
            <div class="login-card-header-accent"></div>
            
            <div class="p-4 p-md-5">
                <div class="text-center mb-4">
                    <span class="text-uppercase-tracking" style="color: var(--tekfix-primary); font-size: 0.75rem;">TEKFIX - ACCESORIOS & TECNOLOGÍA</span>
                    <h2 class="fw-bold text-tekfix-main mt-1 mb-2" style="font-family: var(--font-heading); font-size: 2rem;">Acceso al Panel</h2>
                    <p class="text-tekfix-sec small">Introduce tus credenciales institucionales</p>
                </div>
                
                <form method="POST" action="/auth/login">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                    
                    <div class="mb-4">
                        <label class="form-label text-uppercase-tracking text-tekfix-main" style="font-size: 0.72rem;">Correo Electrónico</label>
                        <div class="input-group">
                            <span class="input-group-text bg-transparent border-end-0 border-tekfix text-tekfix-primary" style="border-radius: 10px 0 0 10px;">
                                <i class="fa-solid fa-envelope"></i>
                            </span>
                            <input type="email" class="form-control form-control-lg border-start-0 border-tekfix" name="email" required placeholder="correo@tekfix.com" autofocus style="border-radius: 0 10px 10px 0; font-size: 0.95rem;">
                        </div>
                    </div>
                    
                    <div class="mb-5">
                        <label class="form-label text-uppercase-tracking text-tekfix-main" style="font-size: 0.72rem;">Contraseña</label>
                        <div class="input-group">
                            <span class="input-group-text bg-transparent border-end-0 border-tekfix text-tekfix-primary" style="border-radius: 10px 0 0 10px;">
                                <i class="fa-solid fa-lock"></i>
                            </span>
                            <input type="password" class="form-control form-control-lg border-start-0 border-tekfix" name="password" required placeholder="••••••••" style="border-radius: 0 10px 10px 0; font-size: 0.95rem;">
                        </div>
                    </div>
                    
                    <div class="d-grid mb-3">
                        <button type="submit" class="btn btn-tekfix btn-lg py-3 fw-bold text-uppercase shadow-sm" style="letter-spacing: 0.08em; font-size: 0.88rem;">
                            Ingresar al Sistema <i class="fa-solid fa-arrow-right ms-2"></i>
                        </button>
                    </div>
                    
                    <div class="text-center mt-4 pt-2 border-top border-tekfix">
                        <small class="text-tekfix-sec" style="font-size: 0.75rem;">
                            <i class="fa-solid fa-shield-halved text-tekfix-primary me-1"></i> Punto de Venta & Gestión Empresarial
                        </small>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Columna Derecha: Identidad Visual Oficial -->
    <div class="col-12 col-md-6 col-lg-6 d-none d-md-flex flex-column justify-content-center align-items-center text-center">
        <div class="p-3">
            <img src="{{ url_for('static', filename='img/Tekfix.jpg') }}" alt="Tekfix - Accesorios & Tecnología" class="img-fluid login-brand-logo mb-3">
            <h4 class="brand-display fw-bold text-tekfix-main m-0" style="letter-spacing: 0.08em;">TEKFIX</h4>
            <p class="section-subtitle mt-1 mb-0" style="color: var(--tekfix-primary); font-size: 0.78rem;">ACCESORIOS & TECNOLOGÍA</p>
        </div>
    </div>
</div>
{% endblock %}
